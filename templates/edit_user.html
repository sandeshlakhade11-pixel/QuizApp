<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User - QuizOps</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            background-color: #0b132b;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }
        .card {
            background: #1c2541;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 1px solid #3a506b;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #94a3b8;
            font-size: 13px;
        }
        .form-control {
            width: 100%;
            padding: 10px;
            background: #0b132b;
            border: 1px solid #3a506b;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .password-container {
            display: flex;
        }
        .password-container input {
            border-top-right-radius: 0;
            border-bottom-right-radius: 0;
        }
        .toggle-btn {
            background: #1c2541;
            border: 1px solid #3a506b;
            border-left: none;
            color: #94a3b8;
            padding: 10px 12px;
            border-top-right-radius: 6px;
            border-bottom-right-radius: 6px;
            cursor: pointer;
        }
        .btn-container {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
        }
        .btn-submit { background: #0284c7; color: #fff; }
        .btn-cancel { background: #475569; color: #fff; }
    </style>
</head>
<body>

    <div class="card">
        <h2 style="text-align: center; color: #38bdf8; margin-bottom: 20px; font-size: 20px;">
            <i class="fa-solid fa-user-pen"></i> Edit User Details
        </h2>

        <form action="{{ url_for('edit_user', user_id=user.id) }}" method="POST">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" class="form-control" value="{{ user.username }}" required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" class="form-control" value="{{ user.email }}" required>
            </div>

            <div class="form-group">
                <label>New Password <span style="color: #64748b;">(Leave blank to keep current)</span></label>
                <div class="password-container">
                    <input type="password" id="editPassword" name="password" class="form-control" placeholder="Enter new password">
                    <button type="button" class="toggle-btn" onclick="togglePassword()"><i id="eyeIcon" class="fa-solid fa-eye"></i></button>
                </div>
            </div>

            <div class="form-group">
                <label>Role</label>
                <select name="role" class="form-control" required>
                    <option value="Student" {% if user.role == 'Student' %}selected{% endif %}>Student</option>
                    <option value="Teacher" {% if user.role == 'Teacher' %}selected{% endif %}>Teacher</option>
                    <option value="Admin" {% if user.role == 'Admin' %}selected{% endif %}>Admin</option>
                </select>
            </div>

            <div class="btn-container">
                <button type="submit" class="btn btn-submit">Save Changes</button>
                <a href="{{ url_for('admin_dashboard') }}" class="btn btn-cancel">Cancel</a>
            </div>
        </form>
    </div>

    <script>
        function togglePassword() {
            const passInput = document.getElementById('editPassword');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                eyeIcon.className = 'fa-solid fa-eye-slash';
            } else {
                passInput.type = 'password';
                eyeIcon.className = 'fa-solid fa-eye';
            }
        }
    </script>
</body>
</html>
