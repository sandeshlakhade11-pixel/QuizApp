<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - QuizOps</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0d1b2a;
            color: #ffffff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-card {
            background-color: #1b263b;
            border-radius: 12px;
            padding: 35px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            border: 1px solid #415a77;
        }
        .form-label {
            color: #e0e1dd !important;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .form-control, .form-select {
            background-color: #0d1b2a;
            border: 1px solid #415a77;
            color: #ffffff !important;
            padding: 10px 14px;
        }
        .form-control::placeholder {
            color: #778da9;
        }
        .form-control:focus, .form-select:focus {
            background-color: #0d1b2a;
            color: #ffffff;
            border-color: #00b4d8;
            box-shadow: 0 0 8px rgba(0, 180, 216, 0.5);
        }
        .btn-primary {
            background-color: #00b4d8;
            border: none;
            font-weight: bold;
            font-size: 1rem;
        }
        .btn-primary:hover {
            background-color: #0077b6;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="text-center mb-4">
        <h2 class="fw-bold text-white">🎓 QuizOps Login</h2>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }} p-2 text-center" role="alert">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('login') }}" method="POST" autocomplete="off">
        <div class="mb-3 text-start">
            <label class="form-label">Select Role</label>
            <select name="role" class="form-select" required>
                <option value="" selected disabled>-- Select Your Role --</option>
                <option value="Student">Student</option>
                <option value="Teacher">Teacher</option>
                <option value="Admin">Admin</option>
            </select>
        </div>

        <div class="mb-3 text-start">
            <label class="form-label">Username or Email</label>
            <input type="text" name="username" class="form-control" placeholder="Enter Username or Email" required>
        </div>

        <div class="mb-3 text-start">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" placeholder="Enter Password" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 mt-2">Login</button>
    </form>

    <div class="mt-4 text-center">
        <span style="color: #e0e1dd;">Don't have an account?</span> 
        <a href="{{ url_for('register') }}" class="text-info text-decoration-none fw-bold">Register Here</a>
    </div>
</div>

</body>
</html>
